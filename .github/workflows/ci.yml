name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # timeout-minutes: about three times the longest run measured (run
  # 42978911434 and the two before it), so a hang fails in minutes, not
  # after GitHub's 6 hours; inside, every test step stops itself after 5
  # (self-test) or 10 (GUI step) minutes and names itself
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5        # measured 0.1 min
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No personal data, captures or secrets in the repository
        run: python .github/scripts/privacy_check.py

  self-test:
    runs-on: ubuntu-22.04   # still has Python 3.8 builds
    timeout-minutes: 15       # measured 1.8-2.8 min
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Syntax check
        run: python -m py_compile miniwireshark.py
      - name: Install capture library
        run: python -m pip install "scapy>=2.5" psutil
      - name: Self-test
        env:
          MINIWIRESHARK_DATA: ${{ runner.temp }}/mw-data
          MINIWIRESHARK_CONFIG: ${{ runner.temp }}/mw-config.json
        run: xvfb-run -a python miniwireshark.py --self-test

  gui-test:
    # the real window, driven step by step under a virtual display
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20       # measured 5.3-5.5 min (24.04)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install capture library
        run: python -m pip install "scapy>=2.5" psutil
      - name: GUI test
        if: matrix.os != 'ubuntu-22.04'
        env:
          MINIWIRESHARK_DATA: ${{ runner.temp }}/mw-data
          MINIWIRESHARK_CONFIG: ${{ runner.temp }}/mw-config.json
        run: |
          sudo apt-get install -y xvfb > /dev/null
          xvfb-run -a -s "-screen 0 1920x1080x24" python -X faulthandler miniwireshark.py --gui-test
      - name: GUI test (under gdb, for the native backtrace of the crash)
        # 22.04 only: the run died with "Segmentation fault" and no output
        # (libXft 2.3.4 drawing colour emoji; the app now leaves colour
        # fonts out there, see xft_color_font_guard). Kept under gdb so a
        # native crash still shows its stack. gdb follows the start's exec into the compiled copy; on a crash
        # it prints every thread's native stack and the loaded libraries,
        # then lets the signal through so faulthandler prints the Python
        # stack too. The exit code is the test's (255 after a crash).
        if: matrix.os == 'ubuntu-22.04'
        env:
          MINIWIRESHARK_DATA: ${{ runner.temp }}/mw-data
          MINIWIRESHARK_CONFIG: ${{ runner.temp }}/mw-config.json
          PYTHONUNBUFFERED: "1"
        run: |
          sudo apt-get update -qq && sudo apt-get install -y xvfb gdb > /dev/null
          python -c "import sys, tkinter; print(sys.version); print('Tk', tkinter.TkVersion, tkinter.Tcl().eval('info patchlevel'))"
          ldd "$(python -c 'import _tkinter; print(_tkinter.__file__)')" | grep -Ei 'tk|tcl|xft|fontconfig|freetype|x11'
          fc-match sans-serif; fc-list | wc -l
          cat > "$RUNNER_TEMP/crash.gdb" <<'EOF'
          set pagination off
          handle SIGPIPE nostop noprint pass
          run
          if $_isvoid($_exitcode)
            thread apply all bt 30
            info sharedlibrary
            continue
          end
          EOF
          xvfb-run -a -s "-screen 0 1920x1080x24" gdb -q -batch -return-child-result \
            -x "$RUNNER_TEMP/crash.gdb" --args python -X faulthandler miniwireshark.py --gui-test

  windows:
    # the Windows-only paths (compiled start and hand-off, notifier,
    # memory reading, PowerShell checks) run here between PC runs
    runs-on: windows-latest
    timeout-minutes: 35       # measured 9.2 min (3.14) with a 3-minute wait in it
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - name: Keep the file's own line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install capture library
        run: python -m pip install "scapy>=2.5" psutil
      - name: Self-test
        env:
          MINIWIRESHARK_DATA: ${{ runner.temp }}\mw-data
          MINIWIRESHARK_CONFIG: ${{ runner.temp }}\mw-config.json
        run: python miniwireshark.py --self-test
      - name: GUI test
        env:
          MINIWIRESHARK_DATA: ${{ runner.temp }}\mw-gui-data
          MINIWIRESHARK_CONFIG: ${{ runner.temp }}\mw-gui-config.json
        run: python -X faulthandler miniwireshark.py --gui-test

  # real macOS: the arp output, symlink and permission paths run there for
  # real instead of mocked (court batch 3)
  self-test-macos:
    runs-on: macos-latest
    timeout-minutes: 30       # a run hung for 6 hours
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install capture library
        run: python -m pip install "scapy>=2.5" psutil
      - name: Self-test
        env:
          MINIWIRESHARK_DATA: ${{ runner.temp }}/mw-data
          MINIWIRESHARK_CONFIG: ${{ runner.temp }}/mw-config.json
        run: python miniwireshark.py --self-test
