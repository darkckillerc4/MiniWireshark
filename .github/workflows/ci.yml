name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-22.04   # still has Python 3.8 builds
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Syntax check
        run: python -m py_compile miniwireshark.py
      - name: Install capture library
        run: python -m pip install "scapy>=2.5" psutil
      - name: Self-test
        env:
          MINIWIRESHARK_DATA: ${{ runner.temp }}/mw-data
          MINIWIRESHARK_CONFIG: ${{ runner.temp }}/mw-config.json
        run: xvfb-run -a python miniwireshark.py --self-test

  gui-test:
    # the real window, driven step by step under a virtual display
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install capture library
        run: python -m pip install "scapy>=2.5" psutil
      - name: GUI test
        env:
          MINIWIRESHARK_DATA: ${{ runner.temp }}/mw-data
          MINIWIRESHARK_CONFIG: ${{ runner.temp }}/mw-config.json
        run: |
          sudo apt-get install -y xvfb > /dev/null
          xvfb-run -a -s "-screen 0 1920x1080x24" python -X faulthandler miniwireshark.py --gui-test

  windows:
    # the Windows-only paths (compiled start and hand-off, notifier,
    # memory reading, PowerShell checks) run here between PC runs
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - name: Keep the file's own line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install capture library
        run: python -m pip install "scapy>=2.5" psutil
      - name: Self-test
        env:
          MINIWIRESHARK_DATA: ${{ runner.temp }}\mw-data
          MINIWIRESHARK_CONFIG: ${{ runner.temp }}\mw-config.json
        run: python miniwireshark.py --self-test
      - name: GUI test
        env:
          MINIWIRESHARK_DATA: ${{ runner.temp }}\mw-gui-data
          MINIWIRESHARK_CONFIG: ${{ runner.temp }}\mw-gui-config.json
        run: python -X faulthandler miniwireshark.py --gui-test
