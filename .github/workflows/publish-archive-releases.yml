name: Publish archived releases

# Run by hand: Actions → "Publish archived releases" → Run workflow.
# Creates one GitHub release (with tag) for every archived MiniWireshark
# version listed in .github/archive-releases.json. Files are checked against
# their SHA-256 first; existing releases are skipped, so it is safe to re-run.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only verify and print what would be published"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish_archive.py ${{ inputs.dry_run && '--dry-run' || '' }}
