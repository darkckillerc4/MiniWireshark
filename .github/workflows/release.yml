name: Release

# Publishes the version on main as soon as it is finished. A version is
# finished when SCRIPT_VERSION in miniwireshark.py has its own
# "## [x.y.z] — date" section in CHANGELOG.md (not "[Unreleased]").
# The job then creates the tag and the GitHub release with the .py file
# and a .sha256 file, and commits the new row to docs/VERSIONS.md, the
# README and .github/archive-releases.json. If the release exists already,
# it does nothing, so every push to main can run it safely.
on:
  push:
    branches: [main]
    paths: [miniwireshark.py, CHANGELOG.md]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would be published"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # (security review) "Run workflow" can pick any branch: only main may
    # publish, sign with MW_RELEASE_KEY and push the version index. The
    # environment lets the owner keep MW_RELEASE_KEY as an environment
    # secret with a deployment-branch rule of main only (Settings ->
    # Environments -> release); until then the repository secret is used
    environment: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: python3 -m py_compile miniwireshark.py
      - name: Publish and record
        env:
          GH_TOKEN: ${{ github.token }}
          # signs the release (miniwireshark.manifest.json) only when the
          # owner has added this secret; without it nothing changes
          MW_RELEASE_KEY: ${{ secrets.MW_RELEASE_KEY }}
        run: python3 .github/scripts/release_current.py ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Commit the version index
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet; then echo "Nothing to record."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          git commit -am "Record release $(grep -oP '^SCRIPT_VERSION = "\K[^"]+' miniwireshark.py) in the version index"
          git pull --rebase
          git push
