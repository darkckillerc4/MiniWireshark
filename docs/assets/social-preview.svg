<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t">
  <title id="t">MiniWireshark: your network, explained in plain English</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b2d"/>
      <stop offset="1" stop-color="#1b3354"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ea1ff" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#4ea1ff" stop-opacity="0.9"/>
      <stop offset="0.75" stop-color="#b48cff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#b48cff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <image href="logo.svg" x="96" y="150" width="200" height="200"/>
  <g font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
    <text x="340" y="250" font-size="84" font-weight="700" fill="#ffffff" letter-spacing="-1">Mini<tspan fill="#7fbaff">Wireshark</tspan></text>
    <text x="344" y="312" font-size="34" fill="#c9d6ea">Your network, explained in plain English.</text>
  </g>
  <g font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="22" fill="#c9d6ea">
    <g transform="translate(96 430)">
      <rect width="250" height="52" rx="26" fill="#ffffff" fill-opacity="0.06" stroke="#7fbaff" stroke-opacity="0.35"/>
      <text x="125" y="34" text-anchor="middle">Devices &amp; websites</text>
    </g>
    <g transform="translate(366 430)">
      <rect width="230" height="52" rx="26" fill="#ffffff" fill-opacity="0.06" stroke="#7fbaff" stroke-opacity="0.35"/>
      <text x="115" y="34" text-anchor="middle">Security alerts</text>
    </g>
    <g transform="translate(616 430)">
      <rect width="230" height="52" rx="26" fill="#ffffff" fill-opacity="0.06" stroke="#7fbaff" stroke-opacity="0.35"/>
      <text x="115" y="34" text-anchor="middle">Packet analysis</text>
    </g>
    <g transform="translate(866 430)">
      <rect width="338" height="52" rx="26" fill="#ffffff" fill-opacity="0.06" stroke="#7fbaff" stroke-opacity="0.35"/>
      <text x="169" y="34" text-anchor="middle">One Python file · no telemetry</text>
    </g>
  </g>
  <path d="M0 568 L160 568 L180 550 L200 584 L220 540 L240 576 L270 568 L520 568 L540 536 L555 590 L570 552 L590 568 L840 568 L855 556 L870 580 L885 562 L900 568 L1280 568"
        fill="none" stroke="url(#wave)" stroke-width="3" stroke-linejoin="round"/>
</svg>
